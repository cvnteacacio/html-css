<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
    <style>
        * {
            font-family: Arial, Helvetica, sans-serif;
        }
        fieldset {
            max-width: 500px;

            #coluna{
                columns: 2;
            }
        }
    </style>
</head>
<body>
    <form action="cadastro.php" method="post"> <!-- ESTÁ ENVIANDO FOTO -->
        <fieldset>
            <legend>Sexo</legend>
            <p>
                <input type="radio" name="sexo" id="isxmas" value="M" checked>
                <label for="isxmas">Masculino</label><br>
            </p>
            <p>
                <input type="radio" name="sexo" id="isxfem" value="F">
                <label for="isxfem">Feminino</label>
            </p>
        </fieldset>
        <fieldset id="coluna">
            <legend>Esportes Favoritos</legend>
            <input type="checkbox" name="esbas" id="iesbas" checked>
            <label for="iesbas">Basquete</label><br>
            <input type="checkbox" name="esfut" id="iesfut">
            <label for="iesfut">Futebol</label><br>
            <input type="checkbox" name="esnat" id="iesnat">
            <label for="iesnat">Natação</label><br>
            <input type="checkbox" name="esvol" id="iesvol">
            <label for="iesvol">Vôlei</label><br>
            <input type="checkbox" name="esten" id="iesten">
            <label for="iesten">Tênis</label>
        </fieldset>
        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar Tudo">
        </p>
        <fieldset>
            <legend>Cores, Fotos e Satisfação</legend>
            <p>
                <label for="icores">Escolha uma cor:</label>
                <input type="color" name="Cores" id="icores" value="#00ff00">
            </p>
            <p>
                <label for="isatisf">Nível de Satisfação</label>
                <input type="range" name="satisf" id="isatisf" min="1" max="10" value="3">
            </p>
            <p>
                <label for="ifoto">Foto de Perfil:</label>
                <input type="file" name="foto" id="ifoto">
            </p>
        </fieldset>
    </form>
</body>
</html>
