<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vídeos em HTML5</title>
</head>
<body>
    <h1>Inserindo vídeos hospedados localmente.</h1>
    <p>Este vídeo está hospedado no meu próprio servidor.</p>
    <video src="#" width="500" poster="#" controls></video> <!-- Poster seria a thumb, sempre ajustar a largura em px, nesse caso  o local do vídeo é o proprio arquivo no pc.-->
    <h1>Inserindo Vídeos com hospedagem externa</h1> <!--Quando for copiar o link do Youtube, tem que ser pelo incorporar, para vir com os detalhes.-->
    <iframe width="560" height="315" src="https://www.youtube.com/embed/fmaMtILk4-0?si=PX9cs_nsEFMYSso6" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>
