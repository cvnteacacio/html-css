<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            width: 400px;
            border-collapse: collapse;
            /* Por padrão, border-collapse já vem 'separate'. */
            border: 4px solid red;
            
            td {
                border: 1px solid black;
                padding: 8px;

                &.dado {
                    background-color: yellow;
                }
            }

            tr {
                &.linha {
                    background-color: lightgrey;
                }
            }
        }
    </style>
</head>
<body>
    <h1>Minha primeira tabela</h1>
    <!--
    HIERARQUIA DE TABELAS:
    TABLE: Tabela;
        TABLE ROW: Linha de tabela;
            TABLE HEADER: Cabeçalho de Tabela;
            TABLE DATA: Dados de Tabela;
    -->
    <table>
        <tr class="linha"><!-- Primeira Linha -->
            <td>A1
            <td>B1
            <td>C1
        </tr>
        <tr>
            <td>A2
            <td>B2
            <td>C2
        </tr>
        <!-- Na convenção W3C, não tem problema em não ter </td>. Mas por automatização, ele já vem com o fechamento de tag. -->
        <tr>
            <td>A3</td>
            <td>B3</td>
            <td>C3</td>
        </tr>
        <tr>
            <td>A4</td>
            <td class="dado">B4</td>
            <td>C4</td>
            teste <!-- Exemplo de que precisa ser respeitado por hierarquias. -->
        </tr>
    </table>
</body>
</html>
